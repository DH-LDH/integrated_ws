# board_params.yaml
# ==================
# ChArUco 보드 생성 파라미터.
# ros2 run rb3_handeye_calib charuco_board_generator 에서 사용.

charuco_board_generator:
  ros__parameters:
    squares_x: 7               # 가로 칸 수
    squares_y: 5               # 세로 칸 수
    square_length_mm: 40.0     # 체스 칸 크기 (mm) – 인쇄 후 ruler로 실측 확인 필수
    marker_length_mm: 30.0     # ArUco 마커 크기 (mm), square_length_mm * 0.75 이하
    dictionary: "DICT_4X4_50"  # 최대 50개 마커 – 7×5 보드의 마커 수(17)보다 많으면 OK
    dpi: 300                   # 출력 해상도 (일반 레이저 프린터: 300dpi)
    output_path: "/tmp/charuco_board.png"

# ── 인쇄 후 실측 체크리스트 ────────────────────────────────────────────────
# 1. 흰 체스 칸의 실제 크기를 ruler로 측정 → square_length_mm 와 일치하는지 확인
# 2. 측정값이 다르면 출력 배율(100%) 로 재인쇄 (맞춤 인쇄 X)
# 3. 보드를 딱딱한 평면(폼보드, 알루미늄 판 등)에 구김 없이 부착
# 4. square_length_mm / marker_length_mm 값을 실측값으로 업데이트 후 캘리브레이션
